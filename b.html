<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>인스타 카드 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;600;700;800&display=swap">
<style>


:root{--pk-bg:var(--bg); --pk-panel:var(--chip); --pk-ink:var(--ink); --pk-sub:var(--sub); --pk-line:var(--line); --pk-accent:var(--mark);
  --bg:#F5F4F0; --panel:#F9F8F5; --ink:#1B1C1F; --sub:#5D5F66; --line:#D3D2CD; --mark:#B8402A; --chip:#FFFFFF;
  --pill-bg:rgba(20,20,22,.62); --pill-fg:#FFFFFF; --dot:#C4C3BE; --dot-on:#1B1C1F;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121315; --panel:#1C1D21; --ink:#ECECEE; --sub:#A4A6AE; --line:#33353B;
  --mark:#E8705A; --chip:#222429; --dot:#4A4C53; --dot-on:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315; --panel:#1C1D21; --ink:#ECECEE; --sub:#A4A6AE; --line:#33353B;
  --mark:#E8705A; --chip:#222429; --dot:#4A4C53; --dot-on:#ECECEE; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 56px}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
.wrap{max-width:468px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
.wrap > *{min-width:0}
header{padding-top:20px; display:grid; gap:2px}
.eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--sub)}
h1{margin:0; font-size:22px; line-height:1.25; letter-spacing:-.02em}
.pick{display:flex; align-items:center; gap:10px}
.pick label{font-size:13.5px; font-weight:700; color:var(--sub)}
.linkbtn{flex:none; font:inherit; font-weight:800; font-size:13.5px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer}

.metarow{display:flex; align-items:flex-start; gap:10px}
.metarow .meta{flex:1; min-width:0}
.linkbtn.fin[aria-pressed="true"]{color:var(--chip); background:var(--ink); border-color:var(--ink)}
.viewer .linkbtn.fin{display:none}
.linkmsg{margin:-8px 0 0; font-size:13px; font-weight:700; color:var(--sub); min-width:0; overflow-wrap:anywhere}
.linkmsg:empty{display:none}
.linkmsg input{width:100%; font:inherit; font-size:13px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin-bottom:4px}
select{flex:1; min-width:0; font:inherit; font-weight:700; font-size:15px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:8px 10px}
.meta{margin:0; font-size:13.5px; color:var(--sub)}
.meta b{color:var(--mark)}
.tabs{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:12px; padding:3px; background:var(--chip)}
.tabs button{font:inherit; font-weight:800; font-size:14.5px; color:var(--sub); background:transparent; border:0; border-radius:9px; padding:9px 0; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
button:focus-visible, select:focus-visible, .chips a:focus-visible{outline:2px solid var(--mark); outline-offset:2px}

@media (max-width:500px){.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px))); margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}}

.post{position:relative}
.track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; background:var(--panel)}
.track::-webkit-scrollbar{display:none}

.slide{flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative; cursor:pointer}
.slide img, figure img{display:block; width:100%; max-width:100%; height:auto; aspect-ratio:4/5; background:var(--panel)}
.count{position:absolute; top:12px; right:12px; background:var(--pill-bg); color:var(--pill-fg); font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; border-radius:999px; padding:3px 9px}
.fx{position:absolute; top:12px; left:12px; background:var(--mark); color:var(--pill-fg); font-size:12px; font-weight:800; border-radius:999px; padding:3px 9px}
.nav{position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; border:0; background:rgba(255,255,255,.88); display:none; place-items:center; cursor:pointer; padding:0; box-shadow:0 1px 4px rgba(0,0,0,.25)}
.nav svg{display:block}
.nav.prev{left:10px} .nav.next{right:10px}
@media (hover:hover){.nav{display:grid}}
.nav[disabled]{display:none}

.nav.part{width:36px; height:36px; background:#1B1C1F; box-shadow:0 0 0 2px #fff, 0 1px 6px rgba(0,0,0,.35)}  
.nav.part svg path{stroke:#fff}
.dots{display:flex; justify-content:center; flex-wrap:wrap; gap:5px; padding-top:10px}
.dots span{width:6px; height:6px; border-radius:50%; background:var(--dot)}
.dots span.on{background:var(--dot-on)}
.slabel{margin:0; text-align:center; font-size:13.5px; font-weight:700; color:var(--sub); min-width:0; overflow-wrap:anywhere}


.snav{display:flex; align-items:center; gap:6px; padding-top:10px}
.snav .end{flex:none; padding:6px 11px}
.snav .schips{flex:1 1 auto; min-width:0; padding-top:0; position:relative}  
.ends{display:block; margin-top:6px}
.end{font:inherit; font-weight:800; font-size:13.5px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer}
.end[disabled]{opacity:.35; cursor:default}


.jtop{display:flex; align-items:center; gap:6px; padding:0 2px 6px}
.jt{flex:1; min-width:0; text-align:left; font:inherit; font-weight:800; font-size:14px; color:var(--ink); background:none; border:0; padding:4px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer}
.jt::after{content:" ▾"; color:var(--sub); font-size:12px}
.jt:focus-visible{outline:2px solid var(--mark); outline-offset:2px}
nav.jump{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--mbar-h,0px)); z-index:5; background:var(--bg); padding-block:8px}

.mbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:7; background:var(--bg); padding:8px 0 8px; border-bottom:1px solid var(--line)}
.mrow{display:flex; align-items:center; gap:4px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:1px}
.mrow::-webkit-scrollbar{display:none}
.mrow::-webkit-scrollbar{display:none}


.mline{display:flex; align-items:center; gap:6px}
.mwrap{position:relative; flex:1; min-width:0}
.mscr{position:absolute; top:0; bottom:0; width:46px; border:0; padding:0; margin:0; display:none; align-items:center; cursor:pointer; color:var(--ink); background:none}
.mscr.l{left:0; justify-content:flex-start; background:linear-gradient(to left, transparent, var(--bg) 50%)}
.mscr.r{right:0; justify-content:flex-end; background:linear-gradient(to right, transparent, var(--bg) 50%)}
.mscr span{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--chip); border:1px solid var(--line)}
.mwrap.can-l .mscr.l, .mwrap.can-r .mscr.r{display:none}
.mt{flex:none; font-size:12.5px; font-weight:800; color:var(--sub); margin-right:2px}

.mb{flex:none; font:inherit; font-weight:800; font-size:12px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:4px 7px; cursor:pointer; white-space:nowrap}
.mb.undo{border-color:var(--mark); color:var(--mark)}
.mb[hidden]{display:none}

button{touch-action:manipulation}
.mb.arm{color:var(--bg); background:var(--mark); border-color:var(--mark)}
.mmsg{margin:6px 0 0; font-size:12.5px; font-weight:700; color:var(--sub)}
.mmsg:empty{display:none}
@media (max-width:500px){.mbar{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px))); margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px}
.chips a{flex:none; min-width:36px; height:32px; display:grid; place-items:center; border:1px solid var(--line); border-radius:9px; background:var(--chip);
  color:var(--ink); text-decoration:none; font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; position:relative}
.chips a.fix::after{content:""; position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--mark)}
.chips a.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.schips{padding-top:10px; scrollbar-width:none}
.schips::-webkit-scrollbar{display:none}
.schips a:first-child{margin-left:auto}
.schips a:last-child{margin-right:auto}

.list{display:grid; grid-template-columns:minmax(0,1fr); gap:34px; margin-top:6px}
figure{margin:0; display:grid; gap:8px; scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
figcaption{display:flex; align-items:baseline; gap:10px; font-weight:700}
figcaption .n{font-size:17px; font-variant-numeric:tabular-nums}
figcaption .n i{font-style:normal; font-size:11px; color:var(--sub); margin-left:4px; vertical-align:2px}
figcaption .t{font-size:13.5px; color:var(--sub); font-weight:600}
figcaption .f{margin-left:auto; font-size:12px; font-weight:800; color:var(--mark); border:1px solid var(--mark); border-radius:999px; padding:1px 8px}
@media (max-width:500px){figcaption{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  
  nav.jump{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px))); margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}}

section.cap{display:grid; gap:10px; padding-top:16px; border-top:1px solid var(--line)}
section.cap[hidden]{display:none}
section.cap h2{margin:0; font-size:16px}
pre{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--font); font-size:14.5px; line-height:1.6; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px}

.mjl{display:grid; gap:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.mjl .none{margin:0; padding:14px; font-size:14.5px; color:var(--sub)}
.mjl button{display:block; width:100%; text-align:left; font:inherit; font-size:14.5px; line-height:1.55; color:var(--ink); background:transparent; border:0; border-top:1px solid var(--line);
  padding:10px 14px; cursor:pointer; white-space:pre-wrap; overflow-wrap:anywhere}
.mjl button:first-child{border-top:0}
.mjl button:hover{background:var(--chip)}
.mjl button b{font-weight:800; margin-right:6px}
.mjl button span{color:var(--sub); font-size:13px}
.cb.flash, figure.flash .cb{outline:3px solid var(--mark); outline-offset:-3px}
.row{display:flex; align-items:center; gap:12px}
.copy{font:inherit; font-weight:800; font-size:15px; color:var(--bg); background:var(--ink); border:0; border-radius:10px; padding:10px 18px; cursor:pointer}
.done{font-size:13.5px; color:var(--sub); font-weight:700}

.series{display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; margin-top:-6px}
.series::-webkit-scrollbar{display:none}
.series[hidden]{display:none}
.series .sn{flex:none; font-size:13px; font-weight:800; color:var(--sub); margin-right:2px}
.series button{flex:none; font:inherit; font-weight:800; font-size:13.5px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:6px 13px; cursor:pointer}
.series button[aria-current="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.pnav{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.pnav[hidden]{display:none}
.pnav button{min-width:0; font:inherit; font-weight:800; font-size:13.5px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:9px 10px;
  cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pnav button.go{color:var(--bg); background:var(--ink); border-color:var(--ink)}
.pnav button[disabled]{opacity:.35; cursor:default}
#pnav2{margin:0 0 12px}
#pnav3{margin-top:14px}

.ratio{display:flex; gap:6px; justify-content:flex-end; align-items:center; margin-top:-8px}
.ratio .finc{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--sub); margin-right:8px; cursor:pointer; user-select:none}
.ratio .finc:last-child{margin-right:0}
.ratio .finc input{margin:0; width:15px; height:15px; accent-color:var(--ink); cursor:pointer}
.ratio .finc[hidden], .viewer .ratio .finc{display:none}
.deny{margin:0; padding:12px 14px; border-radius:12px; border:1.5px solid var(--mark); background:var(--chip); color:var(--mark); font-weight:800; font-size:14px}
.deny[hidden]{display:none}
.ratio button{font:inherit; font-size:12.5px; font-weight:800; color:var(--sub); background:transparent; border:1px solid var(--line); border-radius:999px; padding:4px 11px; cursor:pointer}
.ratio button[aria-pressed="true"]{color:var(--bg); background:var(--sub); border-color:var(--sub)}
.ratio button[disabled]{opacity:.38; cursor:default}
.cb{background:var(--cbg)}
.yt .cb{aspect-ratio:1/1; display:flex; justify-content:center; align-items:center}
.yt .cb img{width:80%; height:auto}

@media (min-width:501px){
  .post{width:100%; margin-inline:auto;
    max-width:max(240px, calc((100vh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 64px) * .8)); max-width:max(240px, calc((100dvh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 64px) * .8))}
  .list figure .cb{width:100%; justify-self:center;
    max-width:max(240px, calc((100vh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 150px) * .8)); max-width:max(240px, calc((100dvh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 150px) * .8))}
  .yt .post{max-width:max(240px, calc(100vh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 64px)); max-width:max(240px, calc(100dvh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 64px))}
  .yt .list figure .cb{max-width:max(240px, calc(100vh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 150px)); max-width:max(240px, calc(100dvh - var(--mbar-h, 56px) - var(--frz-h, 0px) - 150px))}
}

.frz{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:-10px}
.frz > *{min-width:0}
@media (min-width:501px){
  .frz{position:sticky; top:env(safe-area-inset-top,0px); z-index:8; background:var(--bg); padding-block:8px; margin-top:-18px; margin-bottom:-8px}
  .mbar{top:calc(env(safe-area-inset-top,0px) + var(--frz-h,0px))}
  nav.jump{top:calc(env(safe-area-inset-top,0px) + var(--frz-h,0px) + var(--mbar-h,0px))}
}

.memo{display:grid; gap:6px; margin-top:14px}
.memo label{font-size:13px; font-weight:800; color:var(--sub)}
.mhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.khint{font-size:12px; font-weight:600; color:var(--sub)}
@media (hover:none){.khint{display:none}}
textarea.mm{display:block; width:100%; height:46px; min-height:46px; max-height:40vh; resize:none; font:inherit; font-size:16px; line-height:1.5; color:var(--ink); background:var(--chip);
  border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow-y:auto}
textarea.mm::placeholder{color:var(--sub); opacity:.75}
textarea.mm:focus{outline:2px solid var(--mark); outline-offset:1px}
textarea.mm.has{border-color:var(--mark)}
@media (max-width:500px){.fmemo{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}}
.chips a.memo::before{content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:14px; height:2.5px; border-radius:2px; background:var(--mark)}
.dots span.m{background:var(--mark)}
.dots span.m.on{background:var(--dot-on); box-shadow:0 0 0 2px var(--mark)}
.btns{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.btns[hidden]{display:none}
#mbox{display:block; margin-top:6px; max-height:30vh; width:100%; min-height:120px; font:inherit; font-size:14px; color:var(--ink); background:var(--chip); border:1px solid var(--line); border-radius:10px; padding:10px}
#mbox[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important}}


.pkbtn{flex:1 1 14rem; display:flex; align-items:center; gap:8px; min-width:0; font:inherit; font-weight:700; font-size:15px; color:var(--pk-ink); background:var(--pk-panel);
  border:1px solid var(--pk-line); border-radius:10px; padding:8px 12px; cursor:pointer; text-align:left}
.pkbtn .pk-t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pkbtn .pk-c{flex:none; font-size:12.5px; font-weight:700; color:var(--pk-sub)}
.pkbtn:focus-visible{outline:2px solid var(--pk-accent); outline-offset:2px}
.pk{font-family:var(--pk-font, inherit); position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.38); display:flex; justify-content:center; align-items:flex-end;
  box-sizing:border-box; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.pk *{box-sizing:border-box}
.pk[hidden]{display:none}
.pk .pk-sheet{width:100%; max-width:560px; max-height:86vh; display:flex; flex-direction:column; background:var(--pk-bg); color:var(--pk-ink);
  border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.22); padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){ .pk{align-items:center} .pk .pk-sheet{border-radius:16px; max-height:80vh} }
.pk .pk-ph{flex:none; display:flex; align-items:center; gap:8px; padding:16px 16px 10px}
.pk .pk-ph b{flex:1; font-size:16px}
.pk .pk-x{font:inherit; font-size:14px; font-weight:700; color:var(--pk-ink); background:var(--pk-panel); border:1px solid var(--pk-line); border-radius:8px; padding:5px 12px; cursor:pointer}
.pk .pk-sheet:focus{outline:none}
.pk .pk-q{flex:none; width:auto; min-width:0; margin:0 16px 10px; font:inherit; font-size:15px; color:var(--pk-ink); background:var(--pk-panel); border:1px solid var(--pk-line); border-radius:10px; padding:9px 12px}
.pk .pk-tags{flex:none; display:flex; gap:6px; padding:2px 16px 10px; overflow-x:auto; scrollbar-width:none}
.pk .pk-tags[hidden]{display:none}
.pk .pk-tags button{flex:none; font:inherit; font-size:13px; font-weight:700; color:var(--pk-sub); background:var(--pk-panel); border:1px solid var(--pk-line); border-radius:999px; padding:5px 11px; cursor:pointer}
.pk .pk-tags button[aria-pressed="true"]{color:var(--pk-bg); background:var(--pk-ink); border-color:var(--pk-ink)}
.pk .pk-sort{flex:none; display:flex; align-items:center; gap:6px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none}
.pk .pk-sort span{flex:none; font-size:12.5px; font-weight:700; color:var(--pk-sub); margin-right:2px}
.pk .pk-sort button{flex:none; font:inherit; font-size:13px; font-weight:700; color:var(--pk-sub); background:transparent; border:1px solid var(--pk-line); border-radius:8px; padding:4px 10px; cursor:pointer}
.pk .pk-sort button[aria-pressed="true"]{color:var(--pk-ink); background:var(--pk-panel); border-color:var(--pk-ink)}
.pk ul{flex:1 1 auto; min-height:0; list-style:none; margin:0; padding:2px 8px 14px; border-top:1px solid var(--pk-line); overflow-y:auto; -webkit-overflow-scrolling:touch}
.pk li > button{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; width:100%; text-align:left; font:inherit; color:var(--pk-ink);
  background:transparent; border:0; border-radius:10px; padding:10px; cursor:pointer}
.pk li > button:hover{background:var(--pk-panel)}
.pk li > button[aria-current="true"]{background:var(--pk-panel); box-shadow:inset 0 0 0 1.5px var(--pk-accent)}
.pk li .pk-t{font-weight:700; font-size:15px; overflow-wrap:anywhere}
.pk li .pk-g{font-size:12px; font-weight:700; color:var(--pk-sub); align-self:center; white-space:nowrap}
.pk li .pk-s{grid-column:1 / -1; font-size:12.5px; color:var(--pk-sub)}
